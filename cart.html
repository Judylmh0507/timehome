<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart — TIMEHOME Clearance</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <div class="container">
    <div class="logo"><a href="index.html">TIMEHOME Clearance</a></div>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="en/index.html">English</a>
      <a href="zh/index.html">中文</a>
      <a href="cart.html">Cart (<span id="cart-badge">0</span>)</a>
    </nav>
  </div>
</header>

<section class="container" style="padding:40px 0;">
  <h1 style="margin-bottom:24px;">Shopping Cart</h1>
  <div id="cart-content"></div>
  <div id="paypal-button-container" style="margin-top:24px;max-width:400px;"></div>
</section>

<footer class="footer">
  <div class="container">
    <div><b>TIMEHOME Clearance</b> &mdash; Guangzhou Panyu Time Home Furniture Firm</div>
    <div style="margin-top:8px;font-size:14px;color:#888;">Email: sales@timehome.top | WeChat/Phone: +86 18602074495</div>
  </div>
</footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="https://www.paypal.com/sdk/js?client-id=BAAFqtuKfj_0xOdlzo_1xvqsS8hmg7j4_fBIzROz7nTG6h4a6lvzHHu_cuua1kfofxRnqk8XIuAxGk9DLc&currency=USD&components=buttons&disable-funding=credit"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  renderCartPage();

  if (typeof paypal !== 'undefined') {
    paypal.Buttons({
      style: {
        layout: 'vertical',
        color: 'gold',
        shape: 'rect',
        label: 'paypal',
        height: 45
      },
      createOrder: async function () {
        var cart = getCart();
        var list = Object.keys(cart).map(function (id) {
          return { id: id, qty: cart[id] };
        });
        var res = await fetch('/api/paypal/create-order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cart: list })
        });
        var data = await res.json();
        if (data.error) { alert(data.error); throw new Error(data.error); }
        return data.orderID;
      },
      onApprove: async function (data) {
        console.log('=== onApprove triggered ===', data);
        try {
          var res = await fetch('/api/paypal/capture-order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ orderID: data.orderID })
          });
          var result = await res.json();
          console.log('=== capture result ===', result);
          if (result.success) {
            localStorage.removeItem('timehome_cart');
            alert('Payment successful! Order ID: ' + result.orderID);
            window.location.href = 'index.html';
          } else {
            alert('Payment failed: ' + (result.error || 'Unknown error'));
          }
        } catch (e) {
          console.error('Capture error:', e);
          alert('Capture error: ' + e.message);
        }
      },
      onError: function (err) {
        console.error('PayPal error:', err);
        alert('PayPal error: ' + (err.message || JSON.stringify(err)));
      }
    }).render('#paypal-button-container');
  } else {
    console.error('PayPal SDK not loaded');
  }
});
</script>
</body>
</html>
