<script>
function addTestToCart() {
  var cart = JSON.parse(localStorage.getItem('timehome_cart') || '{}');
  cart['test-1'] = (cart['test-1'] || 0) + 1;
  localStorage.setItem('timehome_cart', JSON.stringify(cart));
  alert('Test product added to cart. Cart count: ' + Object.values(cart).reduce((a,b)=>a+b,0));
  document.getElementById('cart-badge').textContent = Object.values(cart).reduce((a,b)=>a+b,0);
}
document.addEventListener('DOMContentLoaded', function () {
  var cart = JSON.parse(localStorage.getItem('timehome_cart') || '{}');
  document.getElementById('cart-badge').textContent = Object.values(cart).reduce((a,b)=>a+b,0);
});
</script>
